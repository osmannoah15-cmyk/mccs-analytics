# Render Blueprint. In Render choose New > Blueprint and point it at this
# repo, or create the service and database manually using these values.
services:
  - type: web
    name: mccs-revenue-intelligence
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mccs-ri-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: AUTO_SEED
        value: "true"
      - key: ASKSAGE_MODEL
        value: gpt-4.1-mini
      - key: ASKSAGE_USER_BASE
        value: https://api.asksage.ai/user
      - key: ASKSAGE_SERVER_BASE
        value: https://api.asksage.ai/server
      # Set these in the Render dashboard, not here.
      - key: ASKSAGE_API_KEY
        sync: false
      - key: ASKSAGE_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: mccs-ri-db
    plan: basic-256mb
    databaseName: mccs_ri
    user: mccs_ri_user
